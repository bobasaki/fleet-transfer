name: CI

# Runs the OS-portable gates on every PR and on pushes to main: type-check,
# unit tests, production build, and the behavioral e2e specs (a–g). The visual
# snapshot suite (visual.spec.ts) is intentionally skipped here — its Linux
# baselines (*-linux.png) haven't been generated yet, so it stays a local gate
# until they are (see testIgnore in frontend/playwright.config.ts).
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Production build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: E2E (behavioral specs; visual snapshots skipped via CI)
        run: npx playwright test
